[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="quantumshield"
version="0.1.0"
description="Post-quantum cryptography research and security operations platform"
readme="README.md"
requires-python=">=3.11"
license={text="Apache-2.0"}
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","pydantic-settings>=2.4,<3","python-multipart>=0.0.9","cryptography>=43,<46","prometheus-client>=0.20,<1"]
[project.optional-dependencies]
dev=["pytest>=8.3,<9","pytest-cov>=5,<7","httpx>=0.27,<1","ruff>=0.6,<1","mypy>=1.11,<2","hypothesis>=6.110,<7"]
[tool.hatch.build.targets.wheel]
packages=["src/quantumshield"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q --strict-markers"
[tool.ruff]
line-length=100
target-version="py311"
[tool.ruff.lint]
select=["E","F","I","B","UP"]
